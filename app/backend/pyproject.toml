[project]
name = "boldsearch"
version = "0.2.0"
description = "Interactive video shot retrieval system for the HCM AI Challenge."
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "einops>=0.8.2",
    "fastapi==0.115.12",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.0",
    "pymilvus>=2.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.57.0,<5.0.0",
    "uvicorn[standard]==0.34.3",
]

[tool.uv]
# An app, not a library: nothing imports `boldsearch`, so uv must not build it.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
