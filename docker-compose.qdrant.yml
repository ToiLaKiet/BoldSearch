# Qdrant -- vector store provider option B.
#
# Based on https://qdrant.tech/documentation/installation/#docker-compose
#   docker compose -f docker-compose.qdrant.yml up -d
#
# The inline `configs.content` needs Docker Compose >= 2.23.1.

# Keeps this provider in its own project, so `down` here never touches the
# milvus stack.
name: boldsearch-qdrant

services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.18.2
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      # Qdrant needs block-level storage: it does not work on NFS or S3.
      - ${DOCKER_VOLUME_DIRECTORY:-.}/vector-db-data/qdrant:/qdrant/storage

configs:
  qdrant_config:
    content: |
      log_level: INFO
