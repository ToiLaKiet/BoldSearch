[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-video-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
fgclip = ["torch", "transformers"]

[project.scripts]
aic-video-pipeline = "aic_video_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
